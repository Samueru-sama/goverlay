name: AppImage CI

# Controls when the action will run.
on:
  push:
    paths-ignore: ["**/README.md"]
  pull_request:
    paths-ignore: ["**/README.md"]
  workflow_dispatch: {}

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  build:
    name: "${{ matrix.name }} (${{ matrix.arch }})"
    runs-on: ${{ matrix.runs-on }}
    strategy:
      matrix:
        include:
          - runs-on: ubuntu-latest
            name: "Build goverlay appimage"
            arch: x86_64
          - runs-on: ubuntu-24.04-arm
            name: "Build goverlay appimage"
            arch: aarch64
    container: ghcr.io/pkgforge-dev/archlinux:latest
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Get dependencies
        run: |
          sed -i 's/DownloadUser/#DownloadUser/g' /etc/pacman.conf
          pacman -Syu --noconfirm \
            appstream \
            base-devel \
            cmake \
            cmocka \
            curl \
            dbus \
            fmt \
            gcc-libs \
            git \
            glew \
            glfw \
            glslang \
            glu \
            hicolor-icon-theme \
            lazarus \
            libglvnd \
            libx11 \
            libxkbcommon \
            mesa \
            meson \
            nlohmann-json \
            patchelf \
            pciutils \
            python \
            python-mako \
            python-matplotlib \
            python-numpy \
            qt6ct \
            qt6pas \
            qt6-wayland \
            strace \
            vulkan-headers \
            vulkan-icd-loader \
            vulkan-nouveau \
            vulkan-radeon \
            vulkan-tools \
            wayland \
            wget \
            xorg-server-xvfb \
            zsync

          if [ "$(uname -m)" = 'x86_64' ]; then
          	pacman -Syu --noconfirm vulkan-intel libxnvctrl
          else
          	pacman -Syu --noconfirm \
              vulkan-freedreno vulkan-panfrost vulkan-broadcom
          fi

      - name: Build mangohud
        run: |
          sed -i 's|EUID == 0|EUID == 69|g' /usr/bin/makepkg
          mkdir -p /usr/local/bin
          cp /usr/bin/makepkg /usr/local/bin
          sed -i \
            's|-O2|-O3|; s|MAKEFLAGS=.*|MAKEFLAGS="-j$(nproc)"|; s|#MAKEFLAGS|MAKEFLAGS|' \
            /etc/makepkg.conf
          cat /etc/makepkg.conf

          git clone \
            https://gitlab.archlinux.org/archlinux/packaging/packages/mangohud.git \
            ./mangohud && (
               cd ./mangohud
               sed -i -e "s|x86_64|$(uname -m)|" ./PKGBUILD
               makepkg -f
               ls -la .
               pacman --noconfirm -U *.pkg.tar.*
            )
          rm -rf ./mangohud

      - name: Install debloated packages
        run: |
          if [ "$(uname -m)" = 'x86_64' ]; then
          	PKG_TYPE='x86_64.pkg.tar.zst'
          else
          	PKG_TYPE='aarch64.pkg.tar.xz'
          fi

          LLVM_URL="https://github.com/pkgforge-dev/llvm-libs-debloated/releases/download/continuous/llvm-libs-nano-$PKG_TYPE"
          QT6_URL="https://github.com/pkgforge-dev/llvm-libs-debloated/releases/download/continuous/qt6-base-iculess-$PKG_TYPE"
          LIBXML_URL="https://github.com/pkgforge-dev/llvm-libs-debloated/releases/download/continuous/libxml2-iculess-$PKG_TYPE"
          MESA_URL="https://github.com/pkgforge-dev/llvm-libs-debloated/releases/download/continuous/mesa-mini-$PKG_TYPE"

          wget --retry-connrefused --tries=30 "$LLVM_URL"   -O  ./llvm.pkg.tar.zst
          wget --retry-connrefused --tries=30 "$LIBXML_URL" -O  ./libxml2.pkg.tar.zst
          wget --retry-connrefused --tries=30 "$QT6_URL"    -O  ./qt6-base.pkg.tar.zst
          wget --retry-connrefused --tries=30 "$MESA_URL"   -O  ./mesa.pkg.tar.zst

          pacman -U --noconfirm ./*.pkg.tar.zst
          rm -f ./*.pkg.tar.zst

      # Runs a set of commands using the runners shell
      - name: Build GOverlay
        run: |
          make LAZBUILDOPTS=--lazarusdir=/usr/lib/lazarus
          make prefix=/usr libexecdir=/lib install

      - name: Make AppImage
        run: |
          chmod +x ./appimage/goverlay-appimage.sh
          ./appimage/goverlay-appimage.sh
          mkdir ./dist
          echo "$PWD"
          ls .
          sha256sum *.AppImage*
          mv *.AppImage* ./dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4.4.3
        with:
          name: AppImage-${{ matrix.arch }}
          path: "dist"

  release_nightly:
    name: "nightly release"
    needs: [build]
    permissions:
      actions: read
      security-events: write
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4.1.9
        with:
          name: AppImage-x86_64

      - uses: actions/download-artifact@v4.1.9
        with:
          name: AppImage-aarch64

      - name: Delete previous pre-release
        if: ${{ github.ref_name == 'main' }}
        run: |
          gh release delete "nightly" --repo "${GITHUB_REPOSITORY}" --cleanup-tag  -y
          sleep 5
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        continue-on-error: true

      - name: Create pre-release
        uses: softprops/action-gh-release@v2
        if: ${{ github.ref_name == 'main' }}
        with:
          name: "Goverlay Nightly"
          tag_name: "nightly"
          prerelease: true
          draft: false
          generate_release_notes: true
          make_latest: false
          files: |
            *.AppImage*
